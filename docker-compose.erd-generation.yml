version: "2"
services:

  dhis2-integration:
    image: elmislesotho/dhis2-integration:${IMAGE_TAG:-latest}
    links:
      - db
      - log
    env_file: .env

  db:
    image: openlmis/postgres:12-debezium
    ports:
      - "5432"
    env_file: .env

  log:
    image: openlmis/rsyslog:3
    volumes:
      - '../logs/dhis2-integration:/var/log'
